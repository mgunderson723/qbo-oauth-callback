<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QBO OAuth Callback</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; max-width: 720px;
         margin: 40px auto; padding: 0 16px; line-height: 1.5; }
  h1 { font-size: 1.3rem; }
  .ok { color: #137333; } .err { color: #c5221f; }
  code, pre { background: #f1f3f4; border-radius: 6px; }
  pre { padding: 14px; overflow-x: auto; white-space: pre-wrap; word-break: break-all; }
  button { font-size: 1rem; padding: 8px 16px; border: 0; border-radius: 6px;
           background: #1a73e8; color: #fff; cursor: pointer; }
  .muted { color: #5f6368; font-size: .9rem; }
</style>
</head>
<body>
  <h1>QuickBooks connection</h1>
  <p id="status">Reading redirect…</p>
  <div id="cmd" style="display:none">
    <p>Copy this command and run it in your terminal to finish connecting:</p>
    <pre id="line"></pre>
    <button onclick="copyCmd()">Copy command</button>
    <span id="copied" class="muted"></span>
    <p class="muted">The code is single-use and expires in a few minutes — run it now.
       You can close this tab afterward.</p>
  </div>
<script>
  var SCRIPT = 'C:\\\\Users\\\\matt\\\\Claude MCP\\\\qbo_pull.py';
  var q = new URLSearchParams(location.search);
  var code = q.get('code'), realm = q.get('realmId'), state = q.get('state'), err = q.get('error');
  var status = document.getElementById('status');
  if (err) {
    status.innerHTML = '<span class="err">Authorization error: ' + err + '</span>';
  } else if (code && realm) {
    status.innerHTML = '<span class="ok">Authorized. One step left.</span>';
    var cmd = 'python "' + SCRIPT + '" exchange ' + code + ' ' + realm + ' ' + (state || '');
    document.getElementById('line').textContent = cmd;
    document.getElementById('cmd').style.display = 'block';
    window._cmd = cmd;
  } else {
    status.innerHTML = '<span class="err">No code found in the URL. Re-run auth-url and try again.</span>';
  }
  function copyCmd() {
    navigator.clipboard.writeText(window._cmd).then(function () {
      document.getElementById('copied').textContent = 'Copied!';
    });
  }
</script>
</body>
</html>
